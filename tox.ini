[tox]
envlist = py310, py311, 312, 313, dev,
isolated_build = True

[testenv]
description = Test package installation and runtime dependencies
deps =
    poetry
commands =
    poetry install --no-root --no-interaction
    python -c "import matplotlib, pandas, statsmodels, fedfred, numpy; print('All runtime dependencies installed successfully!')"

[testenv:dev]
description = Test development dependencies
deps =
    poetry
commands =
    poetry install --no-root --with dev --no-interaction
    python -c "pandas-stubs = "*"
pytest, pytest-cov, pylint, mypy, bandit, pip-audit, pre-commit, hypothesis, tox, pytest-mock, ipympl, ipywidgets, jupyterlab-lsp, nbdime; print('Development dependencies installed successfully!')"

[testenv:check]
description = Check all dependencies (runtime + dev + optional)
deps =
    poetry
commands =
    poetry install --no-root --with dev --extras "types dask polars" --no-interaction
    python -c "import httpx, cachetools, asyncache, tenacity, pandas, geopandas, dask, dask_geopandas, polars; print('All dependencies (runtime, dev, and optional) installed successfully!')"