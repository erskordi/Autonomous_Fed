[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofed"
version = "0.0.2"
description = "Reinforcement learning for monetary policy: estimated economies, benchmark rules and learned reaction functions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Nikhil Sunder", email = "nss106@miami.edu" },
    { name = "Eritokritos Skordilis", email = "eskordilis@bus.miami.edu" },
]
keywords = ["monetary policy", "reinforcement learning", "SVAR", "state-space models", "macroeconomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "fedfred>=3.0",
    "cultivars>=1.0.0a1",
]

[project.optional-dependencies]
nonlinear = ["torch"]
rl = ["torch", "torchrl==0.14.0", "tensordict==0.14.2"]
notebooks = ["jupyterlab", "ipykernel", "nbconvert[webpdf]"]

[project.urls]
Repository = "https://erskordi.github.io/Autonomous_Fed/"

[dependency-groups]
dev = [
    "pandas-stubs",
    "pytest",
    "pytest-cov",
    "pylint",
    "mypy",
    "bandit",
    "pip-audit",
    "pre-commit",
    "hypothesis",
    "pytest-mock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autofed"]

[tool.hatch.build.targets.sdist]
include = ["src/autofed", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.mypy]
files = "src/autofed"
ignore_missing_imports = true

[tool.pylint]
max-line-length = 250
disable = []
ignore-patterns = [".*\\.pyi$"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
