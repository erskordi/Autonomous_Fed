[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-fed"
version = "0.0.1"
description = "A package for simulating and analyzing the effects of monetary policy in a federal reserve context."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Nikhil Sunder", email = "nss106@miami.edu" },
    { name = "Eritokritos Skordilis", email = "eskordilis@bus.miami.edu" },
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch",
    "fedfred",
    "pandas",
    "numpy",
    "matplotlib",
    "ipympl",
    "ipywidgets",
    "jupyterlab-lsp",
    "nbdime",
    "types-python-dateutil",
    "statsmodels",
    "pymc",
    "pytensor",
    "gymnasium",
    "stable-baselines3",
]

[project.urls]
Repository = "https://erskordi.github.io/Autonomous_Fed/"

[dependency-groups]
dev = [
    "pandas-stubs",
    "pytest",
    "pytest-cov",
    "pylint",
    "mypy",
    "bandit",
    "pip-audit",
    "pre-commit",
    "hypothesis",
    "pytest-mock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_fed"]

[tool.mypy]
files = "src/autonomous_fed"
ignore_missing_imports = true

[tool.pylint]
max-line-length = 250
disable = ["E0401", "R0902", "R0913", "R0917", "R0903", "R1705", "R0911", "R0912", "R0914", "R0915", "R1735", "W0222"]
ignore-patterns = [".*\\.pyi$"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]