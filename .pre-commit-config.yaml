repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: poetry run pylint
        language: system
        types: [python]
        args:
          [
            "--disable=E0401,R0902,R0913,R0917,R0903,R1705,R0911,R0912,R0914,R0915,R1735,W0222",
          ]
        files: ^src/

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        args: ["--ignore-missing-imports"]
        files: ^src/
